name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap.xml <lastmod> comes from each page's last commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check-seo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing, Yandex, Seznam, Naver and Yep that pages changed. The key file sits in public/ and is public by design.
      # Google does not take IndexNow, it reads sitemap.xml. A failed ping must not fail the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 30
          curl -fsS https://onegoodcopy.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -R . | jq -s --arg key "$INDEXNOW_KEY" \
              '{host: "onegoodcopy.com", key: $key, keyLocation: "https://onegoodcopy.com/\($key).txt", urlList: .}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @- -w 'IndexNow HTTP %{http_code}\n'
        env:
          INDEXNOW_KEY: 67e08752256721bed0f96470ca52e734
